<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solicite seu acesso profissional ao ambiente administrativo do Meu Tempo."
    />

    <title>Cadastro administrativo | Meu Tempo</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
  </head>

  <body class="cadastro-administrativo">
    <div class="barra-util">
      <div class="container">
        <span> Uma cidade para todas as pessoas. Um caminho de cada vez. </span>
        <!-- controla a abertura do painel de acessibilidade pelo javascript -->
        <button
          type="button"
          id="btn-abrir-acess"
          class="btn-acess-topo"
          aria-controls="painel-acess-rapido"
          aria-expanded="false"
        >
          Recursos de acessibilidade &rsaquo;
        </button>
      </div>
    </div>
  </body>
</html>
