<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solicite seu acesso profissional ao ambiente administrativo do Meu Tempo."
    />

    <title>Cadastro administrativo | Meu Tempo</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
  </head>

  <body class="cadastro-administrativo">
    <div class="barra-acessibilidade barra-util">
      <div class="conteiner container">
        <span>Uma cidade para todas as pessoas. Um caminho de cada vez.</span>

        <!-- controla a abertura do painel pelo javascript -->
        <button
          type="button"
          id="abrir-painel-acessibilidade"
          class="botao-acessibilidade btn-acess-topo"
          aria-controls="painel-acessibilidade"
          aria-expanded="false"
        >
          Recursos de acessibilidade &rsaquo;
        </button>
      </div>
    </div>

    <!-- painel controlado pelo javascript -->
    <div
      id="painel-acessibilidade"
      class="painel-acessibilidade painel-acess-rapido"
    >
      <div class="conteiner container">
        <strong>Ajustes rápidos de leitura:</strong>

        <div class="botoes-acessibilidade botoes-acess">
          <button type="button" class="aumentar-texto">
            A+ Aumentar texto
          </button>

          <button type="button" class="restaurar-texto">A- Texto normal</button>

          <button type="button" class="alternar-contraste">
            Alto contraste
          </button>

          <button type="button" class="alternar-tema">Tema escuro</button>
        </div>
      </div>
    </div>
  </body>
</html>
